<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - Site do Junin</title>
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <div class="auth-container">
    <div class="auth-form">
      <h2>Cadastro</h2>
      <form id="registerForm">
        <input type="text" id="name" placeholder="Nome completo" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Senha" required>
        <small class="password-hint">Mínimo 8 caracteres, 1 maiúscula e 1 número/símbolo</small>
        <input type="password" id="confirmPassword" placeholder="Confirmar senha" required>
        <button type="submit">Cadastrar</button>
      </form>
      <p>Já tem conta? <a href="login.html">Faça login</a></p>
      <p><a href="index.html">Voltar ao site</a></p>
    </div>
  </div>
  <script src="./js/auth.js"></script>
  <script src="./js/sidebar.js"></script>
</body>
</html>
