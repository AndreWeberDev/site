<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Cadastro - André Junior</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo/AJ_Logo_Design_4.jpg">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/login-animations.css">
  <link rel="stylesheet" href="./css/accessibility.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <span class="hamburger"></span>
    <span class="hamburger"></span>
    <span class="hamburger"></span>
  </button>

  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button class="sidebar-close" onclick="toggleSidebar()">×</button>
    </div>
    <nav class="sidebar-nav">
      <!-- Menu será carregado dinamicamente -->
    </nav>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="auth-container">
    <div class="auth-form">
      <h2>Cadastro</h2>
      <form id="registerForm">
        <input type="text" id="name" placeholder="Nome completo" required>
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Senha" required>
        <small class="password-hint">Mínimo 8 caracteres, 1 maiúscula e 1 número/símbolo</small>
        <input type="password" id="confirmPassword" placeholder="Confirmar senha" required>
        <button type="submit">Cadastrar</button>
      </form>
      <p>Já tem conta? <a href="login.html">Faça login</a></p>
      <p><a href="index.html">Voltar ao site</a></p>
    </div>
  </div>
  <script src="./js/sidebar.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/database.js"></script>
  <script src="./js/auth.js"></script>
</body>
</html>
