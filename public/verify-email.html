<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Verificar Email - André Junior</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo/AJ_Logo_Design_4.jpg">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/accessibility.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <span class="hamburger"></span>
    <span class="hamburger"></span>
    <span class="hamburger"></span>
  </button>

  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button class="sidebar-close" onclick="toggleSidebar()">×</button>
    </div>
    <nav class="sidebar-nav">
      <!-- Menu será carregado dinamicamente -->
    </nav>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="auth-container">
    <div class="auth-form">
      <h2>Verificar Email</h2>
      <p class="verification-info">Enviamos um código de 6 dígitos para <strong id="userEmail"></strong></p>
      
      <form id="verifyForm">
        <div class="code-input-container">
          <input type="text" class="code-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="code-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="code-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="code-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="code-input" maxlength="1" pattern="[0-9]" required>
          <input type="text" class="code-input" maxlength="1" pattern="[0-9]" required>
        </div>
        <button type="submit">Verificar Código</button>
      </form>
      
      <div class="verification-actions">
        <button class="resend-btn" onclick="resendCode()">Reenviar código</button>
        <p><a href="login.html">Voltar ao login</a></p>
      </div>
    </div>
  </div>
  
  <script src="./js/database.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/sidebar.js"></script>
  <script src="./js/verification.js"></script>
</body>
</html>
