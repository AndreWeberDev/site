<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Admin - André Junior</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo/AJ_Logo_Design_4.jpg">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/admin.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/accessibility.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <span class="hamburger"></span>
    <span class="hamburger"></span>
    <span class="hamburger"></span>
  </button>

  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button class="sidebar-close" onclick="toggleSidebar()">×</button>
    </div>
    <nav class="sidebar-nav">
      <!-- Menu será carregado dinamicamente -->
    </nav>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="main-content" id="mainContent">
    <header>
      <div class="header-logo">
        <img src="./assets/logo/AJ_Logo_Design_4.jpg" alt="AJ Logo" class="logo">
        <h1>Painel Administrativo</h1>
      </div>
      <span id="userInfo"></span>
    </header>

    <main>
      <div class="admin-section">
        <h2>Gerenciar Projetos</h2>
        
        <div class="project-form">
          <h3>Adicionar Projeto</h3>
          <form id="addProjectForm">
            <input type="text" id="projectTitle" placeholder="Título do projeto" required>
            <textarea id="projectDescription" placeholder="Descrição do projeto" required></textarea>
            <input type="url" id="projectLink" placeholder="Link do projeto">
            <input type="text" id="projectImage" placeholder="URL da imagem">
            <button type="submit">Adicionar Projeto</button>
          </form>
        </div>

        <div class="projects-list">
          <h3>Projetos Existentes</h3>
          <div id="projectsList"></div>
        </div>
      </div>
    </main>
  </div>
  
  <script src="./js/database.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/sidebar.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/admin.js"></script>
</body>
</html>
