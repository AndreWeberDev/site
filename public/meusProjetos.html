<!DOCTYPE html>
<html lang="pt-BR">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Meus Projetos - André Junior</title>
    <link rel="stylesheet" href="./css/style.css" />
</head>

<body>
    <h1>Meus Projetos</h1>
    <nav>
        <ul>
            <li><a href="./index.html">
                <button id="bt">Home</button>
                </a></li>
            <li><a href="./projetomario.html">
                <button id="bt">Amostra de meu Minigame</button>
                </a></li>
        </ul>
    </nav>
    <header>

    </header>

    <main>
        <div class="form-container">
            <h2>Adicionar Novo Projeto</h2>
            <form id="form-projeto">
                <label for="imagem">URL da Imagem:</label>
                <input type="url" id="imagem" name="imagem" placeholder="https://exemplo.com/imagem.jpg" required>

                <label for="nome">Nome do Projeto:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" rows="3" required></textarea>

                <label for="link">Link do Projeto:</label>
                <input type="url" id="link" name="link" placeholder="https://github.com/usuario/projeto" required>

                <button type="submit">Adicionar Projeto</button>
            </form>
        </div>


        <table id="tabela-projetos">
            <thead>
                <tr>
                    <th>
                        id
                    </th>
                    <th>
                        imagem
                    </th>
                    <th>nome
                    </th>
                    <th>Descrição
                    </th>

                    <th>
                        link
                    </th>
                </tr>

            </thead>

            <tbody></tbody>
        </table>

    </main>

    <footer>&copy; Todos os direitos reservados | André Junior 2024</footer>
    <script src="./js/script.js"></script>
</body>

</html>
