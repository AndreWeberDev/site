<body>
    <div class="sidebar">
        <div class="sidebar-header">

            <a href="./index.html" class="nav-item">
                <span class="nav-icon">🏠</span>

    <div class="main-content">
        <header>
            <h1>Meus Projetos</h1>
        </header>

        <main>
        <div class="form-container">
            <h2>Adicionar Novo Projeto</h2>
            <form id="form-projeto">
                <label for="imagem">URL da Imagem:</label>
                <input type="url" id="imagem" name="imagem" placeholder="https://exemplo.com/imagem.jpg" required>

                <label for="nome">Nome do Projeto:</label>
                <input type="text" id="nome" name="nome" required>

                <label for="descricao">Descrição:</label>
                <textarea id="descricao" name="descricao" rows="3" required></textarea>

                <label for="link">Link do Projeto:</label>
                <input type="url" id="link" name="link" placeholder="https://github.com/usuario/projeto" required>

                <button type="submit">Adicionar Projeto</button>
            </form>
        </div>


        <div class="projects-grid" id="projects-grid">
            <!-- Cards serão inseridos aqui pelo JavaScript -->
        </div>

    </main>

        <footer>&copy; Todos os direitos reservados | André Junior 2024</footer>
    </div>
    
    <script src="./js/script.js"></script>
</body>
