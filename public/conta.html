<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua Conta - André Junior</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo/AJ_Logo_Design_4.jpg">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/discord-profile.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/accessibility.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <span class="hamburger"></span>
    <span class="hamburger"></span>
    <span class="hamburger"></span>
  </button>

  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button class="sidebar-close" onclick="toggleSidebar()">×</button>
    </div>
    <nav class="sidebar-nav">
      <!-- Menu será carregado dinamicamente -->
    </nav>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="main-content" id="mainContent">
    <header>
      <div class="header-logo">
        <img src="./assets/logo/AJ_Logo_Design_4.jpg" alt="AJ Logo" class="logo">
        <h1>Sua Conta</h1>
      </div>
    </header>

    <main>
      <div class="discord-profile-container">
        <!-- Banner -->
        <div class="profile-banner">
          <div class="banner-color"></div>
          <button class="edit-banner-btn">✏️</button>
        </div>
        
        <!-- Avatar e Info Principal -->
        <div class="profile-header">
          <div class="avatar-section">
            <div class="profile-avatar-large" id="profileAvatar">
              <img src="./assets/img/default-avatar.png" alt="Avatar" id="avatarImg">
              <button class="avatar-edit-btn" onclick="document.getElementById('avatarInput').click()">📷</button>
              <input type="file" id="avatarInput" accept="image/jpeg,image/jpg,image/png,image/gif" style="display: none;" onchange="handleAvatarUpload(event)">
            </div>
            <div class="status-indicator online"></div>
          </div>
          
          <div class="profile-info">
            <div class="username-section">
              <h1 class="display-name" id="displayName">Usuário</h1>
              <span class="username" id="username">#0000</span>
            </div>
            <div class="profile-badges">
              <span class="badge verified">✓</span>
            </div>
          </div>
        </div>
        
        <!-- Conteúdo Principal -->
        <div class="profile-content">
          
          <!-- Crop Modal -->
          <div id="cropModal" class="modal hidden">
            <div class="modal-content">
              <h3>Ajustar Imagem</h3>
              <div class="crop-area">
                <div class="crop-circle">
                  <img id="cropImage" src="" alt="Crop" draggable="false">
                </div>
              </div>
              <div class="crop-zoom">
                <label>Zoom: <input type="range" id="zoomSlider" min="0.5" max="3" step="0.1" value="1"></label>
              </div>
              <div class="modal-actions">
                <button onclick="cancelCrop()">Cancelar</button>
                <button onclick="applyCrop()" class="btn-primary">Salvar</button>
              </div>
            </div>
          </div>
          <!-- Cards de Informações -->
          <div class="profile-cards">
            <!-- Card Sobre Mim -->
            <div class="profile-card">
              <h3>Sobre mim</h3>
              <div class="about-content">
                <textarea id="bio" placeholder="Conte um pouco sobre você..." rows="4"></textarea>
                <button class="save-btn" onclick="saveBio()">Salvar</button>
              </div>
            </div>
            
            <!-- Card Configurações de Perfil -->
            <div class="profile-card">
              <h3>Configurações de Perfil</h3>
              <form id="profileForm">
                <div class="form-group">
                  <label>Nome de Exibição</label>
                  <input type="text" id="profileDisplayName" placeholder="Seu nome">
                </div>
                <div class="form-group">
                  <label>Nome de Usuário</label>
                  <input type="text" id="profileUsername" placeholder="usuario">
                </div>
                <button type="submit" class="discord-btn">Salvar Alterações</button>
              </form>
            </div>
            
            <!-- Card Segurança -->
            <div class="profile-card">
              <h3>Senha e Autenticação</h3>
              <form id="changePasswordForm">
                <div class="form-group">
                  <label>Senha Atual</label>
                  <input type="password" id="currentPassword" placeholder="Senha atual">
                </div>
                <div class="form-group">
                  <label>Nova Senha</label>
                  <input type="password" id="newPassword" placeholder="Nova senha">
                  <small class="form-hint">Mínimo 8 caracteres, 1 maiúscula e 1 número/símbolo</small>
                </div>
                <div class="form-group">
                  <label>Confirmar Nova Senha</label>
                  <input type="password" id="confirmNewPassword" placeholder="Confirmar senha">
                </div>
                <button type="submit" class="discord-btn danger">Alterar Senha</button>
              </form>
            </div>
          </div>
        </div>
      </div>
    </main>

    <footer>&copy; Todos os direitos reservados | André Junior 2025</footer>
  </div>
  
  <script src="./js/database.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/profile-manager.js"></script>
  <script src="./js/conta-upload.js"></script>
  <script src="./js/sidebar.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/imageUtils.js"></script>
  <script src="./js/conta.js"></script>
</body>
</html>
