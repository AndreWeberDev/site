<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua Conta - Site do Junin</title>
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
    </div>
    <nav class="sidebar-nav">
      <!-- Menu será carregado dinamicamente -->
    </nav>
  </div>

  <div class="main-content">
    <header>
      <h1>Sua Conta</h1>
    </header>

    <main>
      <div class="auth-container">
        <div class="auth-form">
          <div class="user-info" id="userInfo">
            <!-- Informações do usuário serão carregadas aqui -->
          </div>
          
          <h3>Alterar Senha</h3>
          <form id="changePasswordForm">
            <input type="password" id="currentPassword" placeholder="Senha atual" required>
            <input type="password" id="newPassword" placeholder="Nova senha" required>
            <small class="password-hint">Mínimo 8 caracteres, 1 maiúscula e 1 número/símbolo</small>
            <input type="password" id="confirmNewPassword" placeholder="Confirmar nova senha" required>
            <button type="submit">Alterar Senha</button>
          </form>
        </div>
      </div>
    </main>

    <footer>&copy; Todos os direitos reservados | André Junior 2025</footer>
  </div>
  
  <script src="./js/auth.js"></script>
  <script src="./js/sidebar.js"></script>
  <script src="./js/conta.js"></script>
</body>
</html>
