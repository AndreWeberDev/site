<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Sua Conta - André Junior</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo/AJ_Logo_Design_4.jpg">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/accessibility.css">
</head>
<body>
  <div class="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
    </div>
    <nav class="sidebar-nav">
      <!-- Menu será carregado dinamicamente -->
    </nav>
  </div>

  <div class="main-content">
    <header>
      <h1>Sua Conta</h1>
    </header>

    <main>
      <div class="auth-container">
        <div class="auth-form">
          <div class="profile-section-account">
            <div class="profile-avatar" id="profileAvatar">
              <img src="./assets/img/default-avatar.png" alt="Avatar" id="avatarImg">
              <button class="avatar-upload" onclick="document.getElementById('avatarInput').click()">📷</button>
              <input type="file" id="avatarInput" accept="image/jpeg,image/jpg,image/png,image/gif" style="display: none;" onchange="handleAvatarUpload(event)">
            </div>
            
            <div class="user-info" id="userInfo">
              <!-- Informações do usuário serão carregadas aqui -->
            </div>
          </div>
          
          <div class="account-tabs">
            <button class="tab-btn active" onclick="showTab('profile')">Perfil</button>
            <button class="tab-btn" onclick="showTab('security')">Segurança</button>
          </div>
          
          <div class="tab-content" id="profileTab">
            <h3>Informações do Perfil</h3>
            <form id="profileForm">
              <input type="text" id="displayName" placeholder="Nome de exibição" required>
              <input type="text" id="username" placeholder="Nome de usuário" required>
              <input type="text" id="nickname" placeholder="Apelido">
              <textarea id="bio" placeholder="Biografia" rows="3"></textarea>
              <button type="submit">Salvar Perfil</button>
            </form>
          </div>
          
          <div class="tab-content" id="securityTab" style="display: none;">
            <h3>Alterar Senha</h3>
            <form id="changePasswordForm">
              <input type="password" id="currentPassword" placeholder="Senha atual" required>
              <input type="password" id="newPassword" placeholder="Nova senha" required>
              <small class="password-hint">Mínimo 8 caracteres, 1 maiúscula e 1 número/símbolo</small>
              <input type="password" id="confirmNewPassword" placeholder="Confirmar nova senha" required>
              <button type="submit">Alterar Senha</button>
            </form>
          </div>
        </div>
      </div>
    </main>

    <footer>&copy; Todos os direitos reservados | André Junior 2025</footer>
  </div>
  
  <script src="./js/database.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/sidebar.js"></script>
  <script src="./js/animations.js"></script>
  <script src="./js/imageUtils.js"></script>
  <script src="./js/conta.js"></script>
</body>
</html>
