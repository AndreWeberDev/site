<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Login - André Junior</title>
  <link rel="icon" type="image/jpeg" href="./assets/logo/AJ_Logo_Design_4.jpg">
  <link rel="stylesheet" href="./css/style.css">
  <link rel="stylesheet" href="./css/auth.css">
  <link rel="stylesheet" href="./css/animations.css">
  <link rel="stylesheet" href="./css/login-animations.css">
  <link rel="stylesheet" href="./css/accessibility.css">
</head>
<body>
  <button class="sidebar-toggle" onclick="toggleSidebar()">
    <span class="hamburger"></span>
    <span class="hamburger"></span>
    <span class="hamburger"></span>
  </button>

  <div class="sidebar hidden" id="sidebar">
    <div class="sidebar-header">
      <h2>Menu</h2>
      <button class="sidebar-close" onclick="toggleSidebar()">×</button>
    </div>
    <nav class="sidebar-nav">
      <!-- Menu será carregado dinamicamente -->
    </nav>
  </div>

  <div class="sidebar-overlay" id="sidebarOverlay" onclick="toggleSidebar()"></div>

  <div class="auth-container">
    <div class="auth-form">
      <h2>Login</h2>
      <form id="loginForm">
        <input type="email" id="email" placeholder="Email" required>
        <input type="password" id="password" placeholder="Senha" required>
        <label class="remember-me">
          <input type="checkbox" id="rememberMe" checked>
          <span>Lembrar de mim</span>
        </label>
        <button type="submit">Entrar</button>
      </form>
      <p>Não tem conta? <a href="register.html">Cadastre-se</a></p>
      <p><a href="index.html">Voltar ao site</a></p>
      
      <!-- Botão de debug temporário -->
      <div style="margin-top: 20px; padding: 10px; background: rgba(255,255,255,0.1); border-radius: 5px; font-size: 12px;">
        <p style="color: #8ab4f8; margin-bottom: 10px;">🔧 Debug (temporário):</p>
        <button type="button" onclick="auth.resetSystem()" style="background: #ff6b6b; color: white; border: none; padding: 5px 10px; border-radius: 3px; margin-right: 5px; cursor: pointer;">Reset Sistema</button>
        <button type="button" onclick="console.log('Usuários:', auth.users)" style="background: #4ecdc4; color: white; border: none; padding: 5px 10px; border-radius: 3px; cursor: pointer;">Ver Usuários</button>
        <p style="margin-top: 5px; color: #9aa0a6;">Admin: andre@admin.com / Naui2742</p>
      </div>
    </div>
  </div>
  <script src="./js/database.js"></script>
  <script src="./js/auth.js"></script>
  <script src="./js/sidebar.js"></script>
  <script src="./js/animations.js"></script>
</body>
</html>
